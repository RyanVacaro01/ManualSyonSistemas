site_name: Manual Syon Sistemas
site_description: Manual do Sistema ERP Syon
site_url: https://syon.example.com/manual

theme:
  name: material
  language: pt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Modo Escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Modo Claro
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: pt
      separator: '[\s\-]+'
      preprocessor: null

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/syon
  generator: false

nav:
  - Inicio: index.md
  - Modulos:
      - modulos/produtos.md
      - modulos/clientes.md
      - modulos/custos.md
      - modulos/pedidos.md
      - modulos/producao.md
      - modulos/expedicao.md
      - modulos/compras.md
      - modulos/recebimento.md
      - modulos/pessoas.md
      - modulos/marketplace.md
      - modulos/indicadores.md
      - modulos/arquivos.md
  - Extras: extras.md
  - Ajuda: ajuda.md
