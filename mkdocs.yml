site_name: Manual Syon Sistemas
site_description: Manual do Sistema ERP Syon
site_url: https://syon.example.com/manual

theme:
  name: material
  language: pt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Modo Escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Modo Claro
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.result
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: pt
      preprocessor: null
      min_length: 2
      separator: '[\s\-\.]+'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/sidebar.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/sidebar.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/syon
  generator: false

nav:
  - Inicio: index.md
  - Modulos:
      - Produtos: modulos/produtos/index.md
      - Clientes: modulos/clientes/index.md
      - Custos: modulos/custos/index.md
      - Pedidos: modulos/pedidos/index.md
      - Producao: modulos/producao/index.md
      - Expedicao:
          - Expedicao: modulos/expedicao/index.md
          - NFe Debitos:
              - NFe Debitos: modulos/expedicao/nfe-debitos/index.md
              - NFe: modulos/expedicao/nfe-debitos/nfe.md
              - Debito: modulos/expedicao/nfe-debitos/debito.md
              - Multa: modulos/expedicao/nfe-debitos/multa.md
              - Juros: modulos/expedicao/nfe-debitos/juros.md
      - Compras: modulos/compras/index.md
      - Recebimento: modulos/recebimento/index.md
      - Pessoas: modulos/pessoas/index.md
      - Marketplace: modulos/marketplace/index.md
      - Indicadores: modulos/indicadores/index.md
      - Arquivos: modulos/arquivos/index.md
  - Extras: extras.md
  - Ajuda: ajuda.md
